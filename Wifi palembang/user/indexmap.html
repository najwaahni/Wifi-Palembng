<!DOCTYPE html>
<html class="light" lang="id">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>WiFi Gratis - Koneksi Publik Untuk Semua</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error-container": "#ffdad6", "primary-fixed": "#ffdad8", "on-primary": "#410006",
                        "tertiary-fixed-dim": "#7cd3e6", "surface-container": "#ffe9e8", "tertiary-container": "#1d8293",
                        tertiary: "#006877", "on-secondary": "#ffffff", "primary-container": "#df323f",
                        "secondary-container": "#dfe0e0", "secondary-fixed-dim": "#c6c6c7", "surface-variant": "#fadcda",
                        "on-secondary-container": "#616363", "surface-container-highest": "#fadcda", "inverse-primary": "#ffb3b0",
                        background: "#fff8f7", "on-surface": "#271717", secondary: "#5d5f5f", "surface-container-low": "#fff0ef",
                        "on-secondary-fixed-variant": "#454747", "on-surface-variant": "#5b403f", "on-primary-container": "#ffffff",
                        error: "#ba1a1a", "surface-tint": "#bc132a", "on-primary-fixed-variant": "#93001b",
                        "surface-container-high": "#ffe1e0", "secondary-fixed": "#e2e2e2", "surface-bright": "#fff8f7",
                        "inverse-on-surface": "#ffedeb", "outline-variant": "#e4bdbc", "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff", "surface-dim": "#f1d3d2", outline: "#8f6f6e", "on-tertiary-container": "#ffffff",
                        "tertiary-fixed": "#a4eeff", "on-tertiary-fixed": "#001f25", "on-background": "#271717",
                        "primary-fixed-dim": "#ffb3b0", "inverse-surface": "#3e2c2b", "on-error-container": "#93000a",
                        "on-secondary-fixed": "#1a1c1c", "on-tertiary-fixed-variant": "#004e5a", "on-tertiary": "#ffffff",
                        primary: "#bb122a", surface: "#fff8f7",
                        "on-primary-fixed": "#410006"
                    },
                    borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
                    spacing: { md: "16px", lg: "24px", gutter: "16px", xs: "4px", "margin-mobile": "16px", "margin-desktop": "48px", sm: "12px", xl: "32px", base: "8px" },
                    fontFamily: { body: ["Inter"], headline: ["Inter"] }
                }
            }
        };
    </script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/shared.css">
    <link rel="stylesheet" href="../assets/css/indexmap.css">
</head>
<body class="text-on-surface selection:bg-primary-fixed h-screen flex flex-col">

<!-- TopNavBar -->
<nav class="flex justify-between items-center w-full px-margin-desktop h-20 z-50 shadow-lg flex-none border-b border-white/10 bg-white">
    <div class="flex items-center gap-3 text-on-surface">
        <img src="../assets/images/palembang-logo.png" alt="Logo Palembang" class="h-10 w-10 md:h-12 md:w-12 object-contain" />
        <div class="text-headline-lg font-bold">
            Peta
            <div class="text-on-surface-variant text-sm"><span style="font-weight: normal;">Kota Palembang</span></div>
        </div>
    </div>
    <div class="hidden md:flex items-center gap-xl">
        <a class="flex items-center gap-1 font-bold border-b-2 pb-1 text-primary border-primary" href="indexmap.html">
            <span class="material-symbols-outlined text-lg">wifi</span>
            <span>Cari WiFi</span>
        </a>
        <a class="flex items-center gap-1 font-medium text-on-surface-variant hover:text-primary transition-colors" href="bantuan.html">
            <span class="material-symbols-outlined text-lg">support_agent</span>
            <span>Bantuan</span>
        </a>
    </div>
    <div class="flex items-center gap-md">
        <button class="md:hidden active:scale-95 duration-150 p-2">
            <span class="material-symbols-outlined text-on-surface-variant" data-icon="menu">menu</span>
        </button>
    </div>
</nav>

<!-- Main Wrapper -->
<main class="flex-1 relative w-full overflow-hidden">
    <!-- Wadah Utama Peta -->
    <div class="absolute inset-0 z-0 h-full w-full" id="map"></div>

    <!-- Left Search Overlay -->
    <div class="absolute top-0 left-0 z-10 w-full md:w-[420px] h-full p-md md:p-lg pointer-events-none flex flex-col">
        <div class="flex flex-col h-full pointer-events-auto overflow-hidden">
            <div class="flex flex-col h-full rounded-xl shadow-2xl border border-white/20 bg-white/10 backdrop-blur-3xl overflow-hidden">
                <div class="p-md border-b border-white/10 bg-white/10/80 flex-none backdrop-blur-sm">
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface/50">search</span>
                        <input id="userSearchInput" class="w-full pl-11 pr-4 py-3 bg-white/15 backdrop-blur-sm rounded-lg border border-white/10 focus:ring-2 focus:ring-primary text-sm placeholder:text-on-surface/40" placeholder="Cari lokasi atau alamat..." type="text">
                    </div>
                    <div class="flex gap-xs mt-md overflow-x-auto scrollbar-hide">
                        <button class="filter-btn bg-primary text-white px-4 py-1.5 rounded-full text-xs whitespace-nowrap" data-filter="all">Semua</button>
                        <button class="filter-btn bg-white/80 text-on-surface-variant px-4 py-1.5 rounded-full text-xs whitespace-nowrap hover:bg-white transition-colors" data-filter="taman">Taman</button>
                        <button class="filter-btn bg-white/80 text-on-surface-variant px-4 py-1.5 rounded-full text-xs whitespace-nowrap hover:bg-white transition-colors" data-filter="perpustakaan">Perpustakaan</button>
                        <button class="filter-btn bg-white/80 text-on-surface-variant px-4 py-1.5 rounded-full text-xs whitespace-nowrap hover:bg-white transition-colors" data-filter="halte">Halte</button>
                    </div>
                </div>

                <div class="p-md border-b border-white/20 flex-none">
                    <h2 class="font-bold text-lg text-on-surface">Lokasi Terdekat</h2>
                    <p class="text-xs text-on-surface-variant" id="locationCount">Menemukan 0 titik akses</p>
                </div>

                <div class="flex-1 overflow-y-auto p-md space-y-md scrollbar-default" id="wifiCardList">
                    <!-- Dynamic WiFi cards rendered by JS -->
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- Shared Data Layer -->
<script src="../assets/js/wifi-data.js"></script>
<!-- Page Logic -->
<script src="../assets/js/indexmap.js"></script>

</body>
</html>
